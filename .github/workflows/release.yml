name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/miao dist/mmcl-cli-linux-x86_64
          chmod +x dist/mmcl-cli-linux-x86_64

      - name: Build AppImage
        run: |
          sudo apt-get install -y fuse libfuse2
          bash appimage/build-appimage.sh
          cp target/appimage/mmcl-linux-*.AppImage dist/ 2>/dev/null || true

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-linux-x86_64-appimage
          path: dist/mmcl-linux-*.AppImage
          if-no-files-found: warn

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-cli-linux-x86_64
          path: dist/mmcl-cli-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      # Windows ships GUI only. The CLI is a Linux-oriented tool
      # (scripting, SSH, headless servers) and rarely useful on Windows.
      - name: Build GUI release binary
        run: cargo build --release -p miao-gui
        shell: pwsh

      - name: Rename binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\miao-gui.exe dist\mmcl-windows-x86_64.exe

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-windows-x86_64
          path: dist/mmcl-windows-x86_64.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name 'mmcl-cli-*' \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Checkout for CHANGELOG
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: source

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          changelog="source/CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "CHANGELOG.md not found; falling back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract the section between "## [<tag>]" and the next "## ["
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$changelog" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "----- Release notes preview -----"
            head -40 release-notes.md
          else
            echo "No matching section for $tag in CHANGELOG; falling back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
