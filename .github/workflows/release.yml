name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binaries
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: cargo build --release --workspace

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/miao dist/mmcl-cli-linux-x86_64
          chmod +x dist/mmcl-cli-linux-x86_64

      - name: Build AppImage
        run: |
          sudo apt-get install -y fuse libfuse2
          bash appimage/build-appimage.sh
          cp target/appimage/mmcl-linux-*.AppImage dist/ 2>/dev/null || true

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-linux-x86_64-appimage
          path: dist/mmcl-linux-*.AppImage
          if-no-files-found: warn

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-cli-linux-x86_64
          path: dist/mmcl-cli-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      # Windows ships both the GUI and the CLI. The CLI is mainly useful for
      # scripting / SSH / headless servers, but Windows users running WSL or
      # PowerShell automation should still have it available.
      - name: Build GUI release binary
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: cargo build --release -p miao-gui
        shell: pwsh

      - name: Build CLI release binary
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: cargo build --release -p miao-cli
        shell: pwsh

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\miao-gui.exe dist\mmcl-windows-x86_64.exe
          Copy-Item target\release\miao.exe dist\mmcl-cli-windows-x86_64.exe

      - name: Upload Windows GUI exe
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-windows-x86_64
          path: dist/mmcl-windows-x86_64.exe

      - name: Upload Windows CLI exe
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-cli-windows-x86_64
          path: dist/mmcl-cli-windows-x86_64.exe

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build GUI release binary
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: cargo build --release --target ${{ matrix.target }} -p miao-gui

      - name: Build CLI release binary
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: cargo build --release --target ${{ matrix.target }} -p miao-cli

      - name: Build .app bundle
        run: |
          set -e
          APP_DIR="dist/MMCL.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp "target/${{ matrix.target }}/release/miao-gui" "$APP_DIR/Contents/MacOS/MMCL"
          chmod +x "$APP_DIR/Contents/MacOS/MMCL"

          # Convert the PNG icon to .icns. macOS runners ship sips + iconutil.
          ICONSET="dist/icon.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/icon.icns"

          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>MMCL</string>
              <key>CFBundleDisplayName</key><string>MMCL</string>
              <key>CFBundleIdentifier</key><string>com.wangsimiao.mmcl</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleExecutable</key><string>MMCL</string>
              <key>CFBundleIconFile</key><string>icon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSMinimumSystemVersion</key><string>10.15</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Package artifacts
        run: |
          cd dist
          tar -czf "mmcl-macos-${{ matrix.arch }}.app.tar.gz" MMCL.app
          cp "../target/${{ matrix.target }}/release/miao" "mmcl-cli-macos-${{ matrix.arch }}"
          chmod +x "mmcl-cli-macos-${{ matrix.arch }}"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-macos-${{ matrix.arch }}
          path: dist/mmcl-macos-${{ matrix.arch }}.app.tar.gz

      - name: Upload macOS CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-cli-macos-${{ matrix.arch }}
          path: dist/mmcl-cli-macos-${{ matrix.arch }}

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-files
          find artifacts -type f \( \
            -name '*.AppImage' \
            -o -name '*.exe' \
            -o -name '*.tar.gz' \
            -o -name 'mmcl-cli-*' \
          \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Checkout for CHANGELOG
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: source

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          changelog="source/CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "CHANGELOG.md not found; falling back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$changelog" \
          | awk '/^\[.+\]: / { skip=1 } !skip { print }' \
          > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "----- Release notes preview -----"
            head -40 release-notes.md
          else
            echo "No matching section for $tag in CHANGELOG; falling back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
