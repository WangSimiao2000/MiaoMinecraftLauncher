name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/miao-gui dist/
          cp target/release/miao dist/
          chmod +x dist/miao-gui dist/miao
          tar czf dist/mmcl-linux-x86_64.tar.gz -C dist miao-gui miao

      - name: Build AppImage
        run: |
          sudo apt-get install -y fuse libfuse2
          bash appimage/build-appimage.sh
          cp target/appimage/MMCL-*.AppImage dist/ 2>/dev/null || true

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-linux-x86_64
          path: dist/mmcl-linux-x86_64.tar.gz

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-linux-x86_64-appimage
          path: dist/MMCL-*.AppImage
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace
        shell: pwsh

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\miao-gui.exe dist\
          Copy-Item target\release\miao.exe dist\
          Copy-Item README.md dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist\ -ErrorAction SilentlyContinue
          $items = @('dist\miao-gui.exe','dist\miao.exe')
          if (Test-Path 'dist\README.md') { $items += 'dist\README.md' }
          if (Test-Path 'dist\LICENSE')   { $items += 'dist\LICENSE' }
          Compress-Archive -Path $items -DestinationPath dist\mmcl-windows-x86_64.zip -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-windows-x86_64
          path: dist/mmcl-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
