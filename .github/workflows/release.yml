name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-14
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/miao-gui dist/
          cp target/release/miao dist/
          chmod +x dist/miao-gui dist/miao
          tar czf dist/mmcl-linux-x86_64.tar.gz -C dist miao-gui miao

      - name: Build AppImage
        run: |
          sudo apt-get install -y fuse libfuse2
          bash appimage/build-appimage.sh
          cp target/appimage/MMCL-*.AppImage dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmcl-linux-x86_64
          path: dist/mmcl-linux-x86_64.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mmcl-linux-x86_64.tar.gz
            dist/MMCL-*.AppImage
          generate_release_notes: true
